# Publishes the site to GitHub Pages on every push to main, including photos
# uploaded through the GitHub website. Before publishing, it sorts the personal
# gallery (tools/build_gallery.py), converts iPhone HEIC photos, and makes
# web-sized copies.
name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # save the updated gallery list back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install --quiet Pillow pillow-heif

      - name: Organize the personal gallery
        run: python3 tools/build_gallery.py

      - name: Save the updated gallery list (keeps your caption edits in one place)
        run: |
          if ! git diff --quiet -- personal/gallery.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add personal/gallery.js
            git commit -m "Update personal gallery [skip ci]"
            git pull --rebase --quiet origin main && git push || echo "::warning::Couldn't save gallery.js back; the site still publishes."
          fi

      - name: Publish web-sized copies only (originals stay in the repo)
        run: |
          find personal -type f -not -path 'personal/_web/*' \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.avif' -o -iname '*.heic' -o -iname '*.heif' \) -delete
          rm -rf tools

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
