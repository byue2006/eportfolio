# Runs after every push to main, including photos uploaded on github.com.
#
#   1. Sorts the personal gallery (tools/build_gallery.py): converts iPhone HEIC,
#      makes web-sized copies in personal/_web/, and rewrites personal/gallery.js.
#      Then rebuilds the pages (tools/build_site.py) so the photos and captions are
#      in the HTML itself, readable without JavaScript and by search engines.
#   2. Commits those results back to main. Cloudflare Pages (brianyue.me) serves the
#      repository as-is, so it picks the new photos up from that commit.
#   3. Publishes a mirror to GitHub Pages (byue2006.github.io/eportfolio). Every page
#      names brianyue.me as its canonical address, so search engines treat the mirror
#      as a copy, not a competing site.
name: Organize gallery and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# one run at a time; a second upload waits for the first to finish
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always the newest commit, not the one that triggered the run
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install --quiet Pillow pillow-heif

      - name: Organize the personal gallery
        run: python3 tools/build_gallery.py

      - name: Rebuild the pages (Personal page and home preview include the photos as HTML)
        run: python3 tools/build_site.py

      - name: Save the organized gallery and rebuilt pages to the repository
        run: |
          git add -A -- personal/ '*.html' sitemap.xml
          if git diff --cached --quiet; then
            echo "Gallery already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Organize personal gallery"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Couldn't push the gallery update."
          exit 1

      - name: Leave out originals and tools from the GitHub Pages mirror
        run: |
          find personal -type f -not -path 'personal/_web/*' \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.avif' -o -iname '*.heic' -o -iname '*.heif' \) -delete
          find . -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.heic' -o -iname '*.heif' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.tif*' -o -iname '*.docx' -o -iname '*.pptx' -o -iname '*.pdf' -o -iname '*.mov' -o -iname '*.mp4' -o -iname '*.m4v' -o -iname '*.step' -o -iname '*.stp' -o -iname '*.stl' -o -iname '*.zip' -o -iname '*.sld*' \) ! -name apple-touch-icon.png ! -name resume.pdf -delete
          rm -rf tools inbox .git CLAUDE.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
